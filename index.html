<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>급식 알리미 (전국판)</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f8c0d8">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급식 알리미">
<link rel="icon" type="image/png" href="./icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
@font-face{font-family:'Hanam Daum';src:url('fonts/hanam-daum.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'HS Santokki';src:url('fonts/hs-santokki.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Mapo Backpacking';src:url('fonts/mapo-backpacking.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Pretendard EL';src:url('fonts/pretendard-el.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Goyang Ilsan';src:url('fonts/goyang-ilsan.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Gwangyang Haetsal';src:url('fonts/gwangyang-haetsal.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Donggrami';src:url('fonts/donggrami.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Midyakda';src:url('fonts/midyakda.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Jeonnam Yuna';src:url('fonts/jeonnam-yuna.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Chungbuk 70';src:url('fonts/chungbuk70.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Taebaek Eunhasu';src:url('fonts/taebaek-eunhasu.woff2') format('woff2');font-display:swap;}
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css');

  :root {
    --c-primary: #c01858;
    --c-accent:  #f060a0;
    --c-light:   #f8c0d8;
    --c-bg:      #f9e0ec;
    --c-card:    #fff8fb;
    --c-text:    #3a1a28;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--app-font, 'Dongle', sans-serif);
    font-size: calc(17px * var(--fs, 1));
    letter-spacing: var(--app-gap, 0);
    min-height: 100vh;
    color: #3a1a28;
    background-color: var(--c-bg);
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 18px, color-mix(in srgb, var(--c-primary) 13%, transparent) 18px, color-mix(in srgb, var(--c-primary) 13%, transparent) 20px),
      repeating-linear-gradient(-45deg, transparent, transparent 18px, color-mix(in srgb, var(--c-primary) 13%, transparent) 18px, color-mix(in srgb, var(--c-primary) 13%, transparent) 20px),
      repeating-linear-gradient(45deg, transparent, transparent 38px, color-mix(in srgb, var(--c-primary) 8%, transparent) 38px, color-mix(in srgb, var(--c-primary) 8%, transparent) 42px),
      repeating-linear-gradient(-45deg, transparent, transparent 38px, color-mix(in srgb, var(--c-primary) 8%, transparent) 38px, color-mix(in srgb, var(--c-primary) 8%, transparent) 42px);
  }
  input, textarea, button, select { font-family: inherit; }


  body::before {
    content: ''; display: block; height: 26px; background-color: var(--c-accent);
    background-image: radial-gradient(circle 2px at 12px 7px, color-mix(in srgb, var(--c-card) 75%, transparent) 2px, transparent 2.5px);
    background-size: 24px 26px; background-repeat: repeat-x;
    -webkit-mask:
      radial-gradient(circle 11px at 12px 15px, #000 11px, transparent 11.5px) 0 0/24px 26px repeat-x,
      linear-gradient(#000, #000) 0 0/100% 15px no-repeat;
    mask:
      radial-gradient(circle 11px at 12px 15px, #000 11px, transparent 11.5px) 0 0/24px 26px repeat-x,
      linear-gradient(#000, #000) 0 0/100% 15px no-repeat;
  }
  body::after {
    content: ''; display: block; height: 26px; background-color: var(--c-accent);
    background-image: radial-gradient(circle 2px at 12px 19px, color-mix(in srgb, var(--c-card) 75%, transparent) 2px, transparent 2.5px);
    background-size: 24px 26px; background-repeat: repeat-x;
    -webkit-mask:
      radial-gradient(circle 11px at 12px 11px, #000 11px, transparent 11.5px) 0 0/24px 26px repeat-x,
      linear-gradient(#000, #000) 0 100%/100% 15px no-repeat;
    mask:
      radial-gradient(circle 11px at 12px 11px, #000 11px, transparent 11.5px) 0 0/24px 26px repeat-x,
      linear-gradient(#000, #000) 0 100%/100% 15px no-repeat;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  }

  @keyframes shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }
  @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }

  .app { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }

  /* 헤더 */
  header { margin-bottom: 14px; text-align: center; position: relative; padding: 0 50px; }
  header::before, header::after { content: '🪽'; font-size: calc(28px * var(--fs, 1)); position: absolute; top: 8px; animation: floatY 2.5s ease-in-out infinite; }
  header::before { left: 0; animation-delay: 0s; }
  header::after  { right: 0; animation-delay: 0.6s; }
  header h1 {
    font-size: calc(52px * var(--fs, 1)); font-weight: 700; letter-spacing: 0.06em; display: inline-block;
    background: linear-gradient(90deg, var(--c-primary) 0%, var(--c-accent) 35%, var(--c-light) 50%, var(--c-accent) 65%, var(--c-primary) 100%);
    background-size: 600px 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: shimmer 2.5s linear infinite, floatY 3s ease-in-out infinite;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(4px 4px 0 var(--c-light));
  }
  header p { font-size: calc(18px * var(--fs, 1)); color: var(--c-primary); margin-top: 8px; letter-spacing: 0.03em; }
  .title-edit { -webkit-text-fill-color: initial; background: none; border: none; cursor: pointer; font-size: calc(15px * var(--fs, 1)); margin-left: 7px; opacity: 0.65; vertical-align: middle; filter: none; animation: none; padding: 2px; }
  .title-edit:hover { opacity: 1; }

  /* ============ 쿨 스킨 ============ */
  body.skin-cool { background-image: none; letter-spacing: -0.01em; }
  body.skin-cool::before, body.skin-cool::after { display: none; }
  body.skin-cool header::before, body.skin-cool header::after { display: none; }
  body.skin-cool header h1 {
    font-size: calc(29px * var(--fs, 1)); font-weight: 800; letter-spacing: -0.03em; display: inline-block;
    background: none; -webkit-text-fill-color: var(--c-primary); color: var(--c-primary);
    filter: none; animation: none;
  }
  body.skin-cool header p { font-size: calc(11px * var(--fs, 1)); font-weight: 500; letter-spacing: 0; opacity: 0.72; }
  body.skin-cool .cute-only { display: none; }
  body.skin-cool .detail::before, body.skin-cool .comments-box::before { display: none; }
  body.skin-cool .school-pill, body.skin-cool .detail, body.skin-cool .comments-box,
  body.skin-cool .timer-box, body.skin-cool .day, body.skin-cool .icon-btn,
  body.skin-cool .modal, body.skin-cool .setup-card { box-shadow: none; }
  body.skin-cool .day { border-radius: 8px; }
  body.skin-cool .day::after { display: none; }
  body.skin-cool .modal { border-width: 1.5px; }
  /* 쿨에서 글씨 크기 살짝 정돈 (Dongle 대비 산세리프가 커 보여서) */
  body.skin-cool header h1 { letter-spacing: -0.03em; }
  body.skin-cool .menu-name, body.skin-cool .detail-date, body.skin-cool .comments-title,
  body.skin-cool .month-label, body.skin-cool .tab, body.skin-cool .day-num { font-weight: 600; }
  body.skin-cool header h1 { font-weight: 700; }
  /* 쿨: 나머지 텍스트도 1pt 작게 */
  /* 쿨: 메모 모달 + 모달 공통 텍스트 축소 */

  /* 쿨 물결 링클 */
  .cool-ripple { position: fixed; border-radius: 50%; pointer-events: none; z-index: 99998;
    border: 2px solid var(--c-accent); background: radial-gradient(circle, color-mix(in srgb, var(--c-accent) 18%, transparent) 0%, transparent 60%);
    transform: translate(-50%, -50%) scale(0); opacity: 0.6; }
  @keyframes coolRippleAnim { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

  /* 상단 바: 학교 선택 + 설정 */
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .school-pill {
    background: #fff8fb; border: 2px solid var(--c-accent); border-radius: 22px; padding: 6px 16px;
    font-size: calc(21px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); cursor: pointer; box-shadow: 2px 2px 0 var(--c-light);
    display: flex; align-items: center; gap: 6px; transition: transform 0.12s;
  }
  .school-pill:hover { transform: scale(1.03); }
  .icon-btn {
    background: #fff8fb; border: 2px solid var(--c-light); border-radius: 50%; width: 38px; height: 38px;
    font-size: calc(18px * var(--fs, 1)); cursor: pointer; color: var(--c-primary); box-shadow: 2px 2px 0 var(--c-light); transition: transform 0.12s;
  }
  .icon-btn:hover { transform: scale(1.08); border-color: var(--c-accent); }
  .icon-btn.on { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
  .fortune-btn { background: none; border: none; box-shadow: none; width: auto; height: auto; font-size: calc(24px * var(--fs, 1)); padding: 0 2px; }
  .fortune-btn:hover { transform: scale(1.15) rotate(-6deg); border: none; }

  /* 월 이동 */
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .month-nav button {
    background: var(--c-card); border: 2px solid var(--c-light); border-radius: 50%; width: 36px; height: 36px;
    font-size: calc(18px * var(--fs, 1)); cursor: pointer; color: var(--c-primary); box-shadow: 2px 2px 0 var(--c-light); transition: transform 0.12s;
  }
  .month-nav button:hover { transform: scale(1.08); border-color: var(--c-accent); }
  .month-label { font-size: calc(30px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); letter-spacing: 0.04em; min-width: 180px; text-align: center; }

  /* 달력 */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: calc(20px * var(--fs, 1)); font-weight: 700; padding: 6px 0 8px; color: var(--c-primary); letter-spacing: 0.05em; }
  .dow.sun { color: #d0204a; }
  .dow.sat { color: #9040c0; }

  .day {
    background: var(--c-card); border-radius: 10px; padding: 5px; min-height: 82px; cursor: pointer;
    border: 2px solid var(--c-light); transition: all 0.12s; display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .day::after {
    content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.12s;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(192,24,88,0.08) 6px, rgba(192,24,88,0.08) 7px), repeating-linear-gradient(-45deg, transparent, transparent 6px, rgba(192,24,88,0.08) 6px, rgba(192,24,88,0.08) 7px);
    pointer-events: none; border-radius: 8px;
  }
  .day.selected::after { opacity: 1; }
  .day:hover { border-color: var(--c-accent); transform: scale(1.02); }
  .day.empty { background: transparent; cursor: default; border: none; }
  .day.today { border-color: var(--c-primary); background: var(--c-card); box-shadow: 0 0 0 3px var(--c-light), inset 0 0 0 1px var(--c-accent); }
  .day.selected { border-color: var(--c-primary); background: linear-gradient(160deg, var(--c-card) 0%, var(--c-bg) 100%); box-shadow: 0 3px 12px rgba(192,24,88,0.2); }
  .day.sun .day-num { color: #d0204a; }
  .day.sat .day-num { color: #9040c0; }
  .day-num { font-size: calc(15px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); position: relative; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .day-num .dn-text { position: relative; z-index: 2; }
  .day-num.has-star .dn-text { color: #7a5a1a; text-shadow: 0 1px 1px rgba(255,255,255,0.7); }
  .fav-star { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: calc(24px * var(--fs,1)); z-index: 1; line-height: 1; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(200,140,40,0.35)); }

  .day-stars-summary { font-size: calc(13px * var(--fs, 1)); margin-top: 8px; display: flex; flex-direction: column; gap: 4px; padding-top: 3px; border-top: 1.5px dashed var(--c-light); }
  .summary-line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d090b0; font-weight: 500; }
  .summary-line.has-stars { color: var(--c-primary); font-weight: 700; }
  .summary-line.no-data { color: #e0b0c8; }
  .cal-fav-name { font-size: calc(9px * var(--fs, 1)); color: #e090a8; margin-left: 3px; font-weight: 600; }

  /* 메인 레이아웃 */
  .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .main-content > * { min-width: 0; }
  @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }

  .detail, .comments-box {
    background: var(--c-card); border-radius: 16px; padding: 18px; border: 2px solid var(--c-light);
    display: flex; flex-direction: column; position: relative; box-shadow: 3px 3px 0 var(--c-light);
  }
  .detail::before, .comments-box::before {
    content: '♥'; position: absolute; top: -10px; right: 10px; font-size: calc(20px * var(--fs, 1)); color: var(--c-accent); line-height: 1;
  }

  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .detail-date-nav { display: inline-flex; align-items: center; gap: 7px; }
  .detail-date { font-size: calc(19px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); }
  .day-arrow {
    background: var(--c-card); border: 2px solid var(--c-light); border-radius: 50%;
    width: 28px; height: 28px; font-size: calc(16px * var(--fs, 1)); line-height: 1; cursor: pointer; color: var(--c-primary);
    box-shadow: 1px 1px 0 var(--c-light); transition: transform 0.12s; flex: none; padding: 0;
  }
  .day-arrow:hover { transform: scale(1.12); border-color: var(--c-accent); }
  .detail-kcal { font-size: calc(14px * var(--fs, 1)); color: var(--c-accent); font-weight: 600; }

  /* 탭 */
  .meal-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    padding: 6px 15px; border-radius: 20px; font-size: calc(17px * var(--fs, 1)); font-weight: 700; cursor: pointer;
    border: 2px solid var(--c-light); background: var(--c-card); color: #c090a8; transition: all 0.12s;
    display: flex; align-items: center; gap: 4px; letter-spacing: 0.03em;
    font-family: var(--app-font, 'Dongle', sans-serif);
  }
  .tab:hover { border-color: var(--c-accent); color: var(--c-primary); transform: scale(1.03); }
  .tab.active-b { background: var(--c-bg); color: var(--c-primary); border-color: var(--c-accent); box-shadow: 2px 2px 0 var(--c-light); }
  .tab.active-l { background: var(--c-bg); color: var(--c-primary); border-color: var(--c-accent); box-shadow: 2px 2px 0 var(--c-light); }
  .tab.active-d { background: var(--c-bg); color: var(--c-primary); border-color: var(--c-accent); box-shadow: 2px 2px 0 var(--c-light); }
  .tab-stars { font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: var(--c-accent); }

  /* 메뉴 목록 */
  .menu-list { display: flex; flex-direction: column; gap: 4px; }
  .menu-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 13px;
    background: var(--c-bg); border-radius: 10px; font-size: calc(17px * var(--fs, 1)); cursor: pointer; user-select: none;
    border: 1.5px solid transparent; transition: all 0.1s;
  }
  .menu-row:hover { background: var(--c-bg); border-color: var(--c-light); }
  .menu-row.favorite { background: var(--c-bg); border-color: var(--c-accent); }
  .menu-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .star-icon { color: var(--c-light); font-size: calc(15px * var(--fs, 1)); transition: color 0.1s; }
  .menu-row.favorite .star-icon { color: var(--c-accent); }
  .menu-name { font-weight: 700; color: var(--c-text); }
  .allergy { font-size: calc(11px * var(--fs, 1)); color: #c8a0b4; margin-left: 8px; white-space: nowrap; }
  .global-stars { font-size: calc(12px * var(--fs, 1)); color: var(--c-accent); margin-left: 5px; font-weight: 700; }
  .crown { font-size: calc(13px * var(--fs, 1)); margin-right: 2px; }
  .no-meal { text-align: center; color: #d8a8c0; padding: 24px 0; font-size: calc(19px * var(--fs, 1)); }

  /* 댓글 */
  .comments-title { font-size: calc(22px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); margin-bottom: 10px; }
  .comment-list { flex: 1; overflow-y: auto; max-height: 280px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; padding-right: 4px; }
  .comment-item { background: var(--c-bg); border-radius: 10px; padding: 9px 12px; font-size: calc(17px * var(--fs, 1)); color: var(--c-text); border: 1.5px solid var(--c-light); overflow-wrap: break-word; word-break: break-word; }
  .comment-meta { display: flex; justify-content: space-between; font-size: calc(14px * var(--fs, 1)); color: #c890a8; margin-bottom: 6px; font-weight: 600; }
  .no-comments { text-align: center; color: #d8a8c0; padding: 24px 0; font-size: calc(18px * var(--fs, 1)); line-height: 1.4; }
  .comment-input-row { display: flex; gap: 6px; }
  .comment-input-row input {
    flex: 1; min-width: 0; border: 2px solid var(--c-light); border-radius: 12px; padding: 8px 12px; font-size: calc(19px * var(--fs, 1));
    font-family: inherit; color: var(--c-text); background: #fffafc; outline: none;
  }
  .comment-input-row input:focus { border-color: var(--c-accent); }
  .comment-input-row button {
    border: 2px solid var(--c-accent); background: var(--c-bg); color: var(--c-primary); border-radius: 12px; padding: 8px 16px;
    font-size: calc(19px * var(--fs, 1)); font-weight: 700; cursor: pointer; font-family: inherit; transition: transform 0.1s;
    flex-shrink: 0; white-space: nowrap;
  }
  .comment-input-row button:hover { transform: scale(1.04); }
  .nick-row { font-size: calc(15px * var(--fs, 1)); color: #c890a8; margin-bottom: 8px; font-weight: 600; }
  .nick-row a { color: var(--c-accent); cursor: pointer; text-decoration: underline; }

  /* 타이머 */
  .timer-box {
    background: linear-gradient(160deg, var(--c-card) 0%, var(--c-bg) 100%); border: 2px solid var(--c-light); border-radius: 16px;
    padding: 14px 18px; margin-top: 16px; box-shadow: 3px 3px 0 var(--c-light); text-align: center; position: relative;
  }
  .timer-label { font-size: calc(22px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); }
  .timer-meal-name { font-size: calc(18px * var(--fs, 1)); color: var(--c-accent); font-weight: 600; }
  .timer-menu-preview { font-size: calc(16px * var(--fs, 1)); color: #c07090; margin-top: 2px; min-height: 18px; }
  .timer-count { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
  .timer-unit { display: flex; flex-direction: column; align-items: center; }
  .timer-num { font-size: calc(36px * var(--fs, 1)); font-weight: 700; color: var(--c-primary); background: #fff; border: 2px solid var(--c-light); border-radius: 8px; padding: 2px 8px; line-height: 1.1; min-width: 54px; }
  .timer-unit-label { font-size: calc(12px * var(--fs, 1)); color: #d090b0; margin-top: 2px; font-weight: 600; }
  .timer-sep { font-size: calc(28px * var(--fs, 1)); font-weight: 700; color: var(--c-light); padding-bottom: 6px; }
  .timer-edit { position: absolute; top: 10px; right: 14px; font-size: calc(14px * var(--fs, 1)); color: #d090b0; cursor: pointer; text-decoration: underline; font-weight: 600; }

  /* ===== 다음 급식 카드 (달력 위) ===== */
  .next-meal-card { margin-bottom: 14px; }
  .next-meal-card:empty { display: none; }
  .nmc-inner {
    background: linear-gradient(135deg, var(--c-bg) 0%, var(--c-card) 100%);
    border: 2.5px solid var(--c-accent); border-radius: 18px; padding: 14px 18px;
    box-shadow: 4px 4px 0 var(--c-light); cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
  }
  .nmc-inner:hover { transform: translateY(-2px); box-shadow: 5px 6px 0 var(--c-light); }

</script>
</head>

    <p>전국 어느 학교든 · 메뉴 별점과 한줄평을 친구들과 공유해요 <span class="cute-only">ᓚᘏᗢ</span></p>

  <div id="mainArea"></div>
</div>

<!-- 모달 마운트 지점 -->
<div id="modalMount"></div>

<script>
/* ============================================================
   급식 알리미 (전국판) — 나이스 Open API 연동
   - 인증키: open.neis.go.kr 에서 발급 → 설정(⚙)에 입력
   - 프록시: CORS 우회용. 비워두면 직접 호출(보통 막힘)
   ============================================================ */

// ---------- 설정 ----------
// ============================================================
//  ▼▼▼ 여기 한 줄만 본인 Cloudflare Worker 주소로 바꿔주세요 ▼▼▼
const PROXY = "https://meal-proxy.mymmj8423pshs.workers.dev";
//  ▲▲▲ 나이스 인증키는 워커 안에 숨겨져 있어요 (사용자 입력 불필요) ▲▲▲
// ============================================================

const LS = {
  school: 'meal_school',
  nick:   'meal_nick',
};
function getSchool(){ try { return JSON.parse(localStorage.getItem(LS.school) || 'null'); } catch(e){ return null; } }
function setSchool(s){ localStorage.setItem(LS.school, JSON.stringify(s)); }

let myNick = localStorage.getItem(LS.nick) || ('익명' + Math.floor(Math.random()*9000+1000));
localStorage.setItem(LS.nick, myNick);

// ---------- 상태 ----------
const ORDER = ['조식','중식','석식'];
const MEALCODE = { '조식':'b', '중식':'l', '석식':'d' };
const DEFAULT_TIMES = { b:'08:00', l:'12:30', d:'18:30' };

let school = getSchool();                 // {office, code, name, kind, addr}
const _now = new Date();
let viewYear  = _now.getFullYear();
let viewMonth = _now.getMonth() + 1;      // 1~12
let meals = { 조식:{}, 중식:{}, 석식:{} }; // {조식:{1:{items,kcal}}, ...}
let selectedDay = null;
let selectedMeal = '중식';
let globalStars = {};                      // 선택 학교의 별점 { "20260601_l_백미밥": 3 }
let favorites = {};                        // 내 별표 (localStorage)
let mealTimes = { ...DEFAULT_TIMES };      // 선택 학교의 급식시간

// ---------- 유틸 ----------
function pad(n){ return String(n).padStart(2,'0'); }
function ymdStr(y,m,d){ return `${y}${pad(m)}${pad(d)}`; }
function schoolKey(){ return school ? `${school.office}_${school.code}` : ''; }
function favLSKey(){ return `meal_favs_${schoolKey()}`; }
function cleanName(s){ return s.replace(/\s*\(\s*[\d.\s]+\)\s*$/, '').replace(/\s+/g,' ').trim(); }
function getAllergy(s){ const m = s.match(/\(\s*([\d.\s]+)\)\s*$/); return m ? m[1].replace(/\s/g,'') : ''; }
function safeKey(s){ return cleanName(s).replace(/[.#$/\[\]]/g,'_'); }
function escapeHtml(str){ return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

// ---------- 나이스 호출 ----------
function neisUrl(endpoint, params){
  const base = `https://open.neis.go.kr/hub/${endpoint}`;
  const qs = new URLSearchParams({ Type:'json', pIndex:'1', pSize:'500', ...params }).toString();
  const full = `${base}?${qs}`;
  return PROXY.replace(/\/$/,'') + '/?url=' + encodeURIComponent(full);
}
async function neisFetch(endpoint, params){
  const res = await fetch(neisUrl(endpoint, params));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function searchSchools(name){
  const json = await neisFetch('schoolInfo', { SCHUL_NM:name });
  return json?.schoolInfo?.[1]?.row || [];
}

async function loadMeals(){
  meals = { 조식:{}, 중식:{}, 석식:{} };
  if (!school) { renderMain(); return; }
  renderMain(true); // 로딩 표시
  try {
    const last = new Date(viewYear, viewMonth, 0).getDate();
    const from = ymdStr(viewYear, viewMonth, 1);
    const to   = ymdStr(viewYear, viewMonth, last);
    const json = await neisFetch('mealServiceDietInfo', {
      ATPT_OFCDC_SC_CODE: school.office,
      SD_SCHUL_CODE: school.code,
      MLSV_FROM_YMD: from,
      MLSV_TO_YMD: to,
    });
    const rows = json?.mealServiceDietInfo?.[1]?.row || [];
    rows.forEach(r => {
      const nm = r.MMEAL_SC_NM || '';
      const day = parseInt(String(r.MLSV_YMD).slice(6,8), 10);
      const items = String(r.DDISH_NM || '').split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean);
      const kcal = Math.round((parseFloat(String(r.CAL_INFO || '').replace(/[^\d.]/g,'')) || 0) * 10) / 10;
      const key = nm.includes('조') ? '조식' : nm.includes('중') ? '중식' : nm.includes('석') ? '석식' : null;
      if (!key) return;
      meals[key][day] = { items, kcal };
    });
  } catch (e) {
    console.error(e);
    renderMain(false, '급식을 못 불러왔어요 😢 인증키나 프록시 설정을 확인해 주세요.\n(' + e.message + ')');
    return;
  }
  renderMain();
  if (selectedDay && selectedDay <= new Date(viewYear, viewMonth, 0).getDate()) {
    selectDay(selectedDay, true);
  }
  renderNextMealCard();
}

// 시간까지 따져서 '다음 끼니' 정보를 계산해 반환 (선택은 안 함)
function getNextMeal(){
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth()+1;
  if (y !== viewYear || mo !== viewMonth) return null; // 이번 달 볼 때만

  const today = now.getDate();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const toMin = (t) => { const [h,m] = String(t||'').split(':').map(Number); return (h||0)*60 + (m||0); };
  const bT = toMin(mealTimes.b), lT = toMin(mealTimes.l), dT = toMin(mealTimes.d);
  const has = (day, meal) => !!(meals[meal] && meals[meal][day]);
  const lastDay = new Date(viewYear, viewMonth, 0).getDate();

  let plan = [];
  if (nowMin < bT)      plan = [[today,'조식'],[today,'중식'],[today,'석식']];
  else if (nowMin < lT) plan = [[today,'중식'],[today,'석식']];
  else if (nowMin < dT) plan = [[today,'석식']];
  else                  plan = [];

  for (const [day, meal] of plan){
    if (has(day, meal)) return { day, meal, isToday:true };
  }
  for (let day = today; day <= lastDay; day++){
    const startFrom = (day === today) ? (nowMin >= dT ? [] : ['조식','중식','석식']) : ['조식','중식','석식'];
    for (const meal of startFrom){
      if (has(day, meal)) return { day, meal, isToday: day===today };
    }
  }
  return null;
}

// 달력 위 '다음 급식' 카드 렌더
function nmcEnabled(){ return localStorage.getItem('nmc_on') === '1'; }
function toggleNextMealCard(){
  const on = !nmcEnabled();
  if (on) localStorage.setItem('nmc_on','1'); else localStorage.removeItem('nmc_on');
  updateNmcBtn();
  renderNextMealCard();
}
function updateNmcBtn(){
  const btn = document.getElementById('nmcToggleBtn');
  if (btn) btn.classList.toggle('on', nmcEnabled());
}
function renderNextMealCard(){
  const box = document.getElementById('nextMealCard');
  if (!box) return;
  updateNmcBtn();
  if (!nmcEnabled()){ box.innerHTML = ''; box.style.display = 'none'; return; }
  const nm = getNextMeal();
  if (!nm){ box.innerHTML = ''; box.style.display = 'none'; return; }
  const data = meals[nm.meal][nm.day];
  const mealEmoji = { '조식':'🌅', '중식':'🍱', '석식':'🌙' };
  const dow = ['일','월','화','수','목','금','토'][new Date(viewYear, viewMonth-1, nm.day).getDay()];
  const dayLabel = nm.isToday ? '오늘' : `${nm.day}일(${dow})`;
  const menuList = (data.items||[]).map(it => cleanName(it)).filter(Boolean);
  const preview = menuList.map(m => `<span class="nmc-item">${escapeHtml(m)}</span>`).join('');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="nmc-inner" onclick="selectDay(${nm.day})">
      <div class="nmc-head">
        <span class="nmc-badge">${mealEmoji[nm.meal]} 다음 급식</span>
        <span class="nmc-when">${dayLabel} · ${nm.meal}</span>
        ${data.kcal ? `<span class="nmc-kcal">🔥 ${data.kcal} kcal</span>` : ''}
      </div>
      <div class="nmc-menu">${preview}</div>
    </div>`;
}

// ---------- 메인 렌더 ----------
function renderMain(loading, errorMsg){
  const area = document.getElementById('mainArea');

  // 학교 미선택 → 안내
  if (!school) {
    area.innerHTML = `
      <div class="setup-card">
        <h2>시작하기 🌸</h2>
        <p>우리 학교를 검색해서 선택하면<br>바로 급식을 볼 수 있어요!</p>
        <div class="row-btns" style="justify-content:center; margin-top:8px;">
          <button class="btn-primary" style="flex:none;" onclick="openSchoolModal()">🏫 학교 검색</button>
        </div>
      </div>`;
    document.getElementById('schoolName').textContent = '학교를 선택해요';
    return;
  }

  document.getElementById('schoolName').textContent = school.name;

  const monthLabel = `${viewYear}년 ${viewMonth}월`;
  let calInner = '';
  if (loading) {
    calInner = `<div class="loading">급식 불러오는 중... 🍱</div>`;
  } else if (errorMsg) {
    calInner = `<div class="loading" style="white-space:pre-line; color:#d04080;">${escapeHtml(errorMsg)}</div>`;
  } else {
    calInner = buildCalendarHTML();
  }

  area.innerHTML = `
    <div id="nextMealCard" class="next-meal-card"></div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-label">${monthLabel}</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid">
      <div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div>
      <div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>
      ${calInner}
    </div>
    <div class="main-content" id="mainContent" style="display:${selectedDay ? 'grid' : 'none'};">
      <div class="detail" id="detail"></div>
      <div class="comments-box" id="commentsBox">
        <div class="comments-title">💬 한줄평</div>
        <div class="nick-row">내 별명: <b>${escapeHtml(myNick)}</b> <a onclick="changeNick()">바꾸기</a></div>
        <div class="comment-list" id="commentList"><div class="no-comments">날짜를 선택해 주세요</div></div>
        <div class="comment-input-row">
          <input id="commentInput" placeholder="오늘 급식 어땠어요?" onkeydown="if(event.key==='Enter')jsAddComment()" maxlength="100">
          <button onclick="jsAddComment()">등록</button>
        </div>
      </div>
    </div>
    ${buildTimerHTML()}
  `;

  if (selectedDay) { renderDetail(); connectCommentRoom(); }
  renderNextMealCard();
}

function buildCalendarHTML(){
  const firstDow = new Date(viewYear, viewMonth - 1, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const real = new Date();
  const isThisMonth = real.getFullYear() === viewYear && (real.getMonth() + 1) === viewMonth;
  const todayDate = real.getDate();

  let html = '';
  for (let i = 0; i < firstDow; i++) html += `<div class="day empty"></div>`;

  const mealEmoji = { '조식':'♨', '중식':'´▽`♡', '석식':'♬' };
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = (firstDow + d - 1) % 7;
    const cls = ['day'];
    if (dow === 0) cls.push('sun');
    if (dow === 6) cls.push('sat');
    if (isThisMonth && d === todayDate) cls.push('today');
    if (d === selectedDay) cls.push('selected');

    const anyMeal = meals['조식'][d] || meals['중식'][d] || meals['석식'][d];
    // 별표(즐겨찾기) 메뉴가 하나라도 있는 날인지 → 형광펜 하이라이트
    const hasFav = ORDER.some(m => getStarCount(d, m) > 0);
    let lines;
    if (!anyMeal) {
      lines = `<div class="summary-line no-data">· · ·</div>`;
    } else {
      lines = ORDER.map(meal => {
        if (!meals[meal][d]) return '';
        const stars = getStarCount(d, meal);
        let favName = '';
        if (stars > 0) {
          const favItem = meals[meal][d].items.find(it => favorites[favId(d, meal, it)]);
          if (favItem) favName = `<span class="cal-fav-name">${escapeHtml(cleanName(favItem))}</span>`;
        }
        return `<div class="summary-line ${stars > 0 ? 'has-stars' : ''}">${mealEmoji[meal]} ${stars}${favName}</div>`;
      }).join('');
    }
    const starShown = hasFav && !_isStarOff(d);
    html += `<div class="${cls.join(' ')}" id="day-cell-${d}" onclick="selectDay(${d})">
      <div class="day-top"><span class="day-num ${starShown?'has-star':''}" onclick="event.stopPropagation();toggleDayStar(${d})" title="별 켜고 끄기">${starShown ? '<span class="fav-star">⭐</span>' : ''}<span class="dn-text">${d}</span></span>${calMemoHTML(d)}</div><div class="day-stars-summary">${lines}</div>
    </div>`;
  }
  return html;
}

function buildTimerHTML(){
  return `
    <div class="timer-box">
      <span class="timer-edit" onclick="openTimeEditor()">⏰ 급식시간 수정</span>
      <div class="timer-label" id="timerLabel">⏳</div>
      <div class="timer-meal-name" id="timerMealName"></div>
      <div class="timer-menu-preview" id="timerMenuPreview"></div>
      <div class="timer-count" id="timerCount">
        <div class="timer-unit"><div class="timer-num" id="timerH">--</div><div class="timer-unit-label">시간</div></div>
        <div class="timer-sep">:</div>
        <div class="timer-unit"><div class="timer-num" id="timerM">--</div><div class="timer-unit-label">분</div></div>
        <div class="timer-sep">:</div>
        <div class="timer-unit"><div class="timer-num" id="timerS">--</div><div class="timer-unit-label">초</div></div>
      </div>
    </div>`;
}

// ---------- 날짜/끼니 선택 ----------
function changeMonth(delta){
  viewMonth += delta;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  selectedDay = null;
  loadMeals();
}

function selectDay(d, keepScroll){
  selectedDay = d;
  document.querySelectorAll('.day').forEach(el => {
    el.classList.toggle('selected', el.id === `day-cell-${d}`);
  });
  const mc = document.getElementById('mainContent');
  if (mc) mc.style.display = 'grid';
  // 선택한 날 첫 유효 끼니로
  if (!meals[selectedMeal][d]) {
    const firstAvail = ORDER.find(m => meals[m][d]);
    if (firstAvail) selectedMeal = firstAvail;
  }
  renderDetail();
  connectCommentRoom();
}

function switchMeal(m){ selectedMeal = m; renderDetail(); connectCommentRoom(); }

function favId(day, meal, item){ return `${ymdStr(viewYear,viewMonth,day)}_${MEALCODE[meal]}_${safeKey(item)}`; }

function getStarCount(day, meal){
  let count = 0;
  if (!meals[meal] || !meals[meal][day]) return 0;
  meals[meal][day].items.forEach(item => { if (favorites[favId(day, meal, item)]) count++; });
  return count;
}

// ---------- 날짜 별 표시 켜고 끄기 (개인 기기) ----------
function _starKey(day){ return `${ymdStr(viewYear,viewMonth,day)}`; }
function _getStarOff(){ try { return JSON.parse(localStorage.getItem('star_off') || '{}'); } catch(e){ return {}; } }
function _isStarOff(day){ return !!_getStarOff()[_starKey(day)]; }
function toggleDayStar(day){
  // 별이 뜰 조건(별표 메뉴 있음)이 아니면 무시
  const hasFav = ORDER.some(m => getStarCount(day, m) > 0);
  if (!hasFav) return;
  const off = _getStarOff();
  const k = _starKey(day);
  if (off[k]) delete off[k]; else off[k] = 1;
  try { localStorage.setItem('star_off', JSON.stringify(off)); } catch(e){}
  refreshDayHighlight(day);
}

function toggleFavorite(day, meal, item){
  const id = favId(day, meal, item);
  const wasOn = !!favorites[id];
  favorites[id] = !wasOn;
  localStorage.setItem(favLSKey(), JSON.stringify(favorites));

  // Firebase 공유 별점 증감 (학교별)
  if (window._fbDb && window._fbRunTransaction && schoolKey()) {
    const starPath = `stars/${schoolKey()}/${id}`;
    const starRef = window._fbRef(window._fbDb, starPath);
    window._fbRunTransaction(starRef, cur => Math.max(0, (cur || 0) + (wasOn ? -1 : 1)));
  }
  renderDetail();
  refreshCalendarCell(day);
  refreshDayHighlight(day);
}

// 별 개수/토글 변화에 따라 날짜 별표시 갱신
function refreshDayHighlight(day){
  const cell = document.getElementById(`day-cell-${day}`);
  if (!cell) return;
  const hasFav = ORDER.some(m => getStarCount(day, m) > 0);
  const starShown = hasFav && !_isStarOff(day);
  const numEl = cell.querySelector('.day-num');
  if (!numEl) return;
  numEl.classList.toggle('has-star', starShown);
  let star = numEl.querySelector('.fav-star');
  if (starShown && !star){
    star = document.createElement('span');
    star.className = 'fav-star';
    star.textContent = '⭐';
    numEl.insertBefore(star, numEl.firstChild); // 숫자 뒤(배경)에 깔기
  } else if (!starShown && star){
    star.remove();
  }
}

function refreshCalendarCell(day){
  const cell = document.getElementById(`day-cell-${day}`);
  if (!cell) return;
  const mealEmoji = { '조식':'♨', '중식':'´▽`♡', '석식':'♬' };
  const lines = ORDER.map(meal => {
    if (!meals[meal][day]) return '';
    const stars = getStarCount(day, meal);
    let favName = '';
    if (stars > 0) {
      const favItem = meals[meal][day].items.find(it => favorites[favId(day, meal, it)]);
      if (favItem) favName = `<span class="cal-fav-name">${escapeHtml(cleanName(favItem))}</span>`;
    }
    return `<div class="summary-line ${stars > 0 ? 'has-stars' : ''}">${mealEmoji[meal]} ${stars}${favName}</div>`;
  }).join('');
  cell.querySelector('.day-stars-summary').innerHTML = lines || `<div class="summary-line no-data">· · ·</div>`;
}

function renderDetail(){
  const detailEl = document.getElementById('detail');
  if (!detailEl || !selectedDay) return;
  const d = selectedDay;
  const firstDow = new Date(viewYear, viewMonth - 1, 1).getDay();
  const DOW = ['일','월','화','수','목','금','토'];
  const dow = DOW[(firstDow + d - 1) % 7];
  const data = meals[selectedMeal][d];
  const tabClasses = { '조식':'active-b', '중식':'active-l', '석식':'active-d' };

  const tabs = ORDER.map(m => {
    const avail = !!meals[m][d];
    const stars = getStarCount(d, m);
    return `<button class="tab${m===selectedMeal?' '+tabClasses[m]:''}" style="${avail?'':'opacity:.4;'}" onclick="switchMeal('${m}')">${m} ${stars>0?`<span class="tab-stars">★${stars}</span>`:''}</button>`;
  }).join('');

  let rows = '';
  if (data) {
    const starCounts = data.items.map(item => globalStars[favId(d, selectedMeal, item)] || 0);
    const maxStars = Math.max(0, ...starCounts);
    rows = data.items.map((item, idx) => {
      const isFav = !!favorites[favId(d, selectedMeal, item)];
      const count = starCounts[idx];
      const isCrown = maxStars > 0 && count === maxStars;
      const starBadge = count > 0 ? `<span class="global-stars">(별 ${count})</span>` : '';
      const crown = isCrown ? `<span class="crown">👑</span>` : '';
      const allergy = getAllergy(item);
      return `<div class="menu-row ${isFav ? 'favorite' : ''}" onclick="toggleFavorite(${d}, '${selectedMeal}', ${JSON.stringify(item).replace(/"/g,'&quot;')})">
        <div class="menu-left"><span class="star-icon">★</span><span class="menu-name">${crown}${escapeHtml(cleanName(item))}</span>${starBadge}</div>
        ${allergy ? `<span class="allergy">${allergy}</span>` : ''}
      </div>`;
    }).join('');
  } else {

// ---------- 하루씩 이동 ----------
function changeDay(delta){
  if (!selectedDay) return;
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const nd = selectedDay + delta;
  if (nd < 1) {
    // 이전 달 마지막 날로
    viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    selectedDay = new Date(viewYear, viewMonth, 0).getDate();
    loadMeals();
  } else if (nd > daysInMonth) {
    // 다음 달 1일로
    viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    selectedDay = 1;
    loadMeals();
  } else {
    selectDay(nd);
    document.getElementById('detail')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ---------- Firebase: 댓글 / 별점 (학교별) ----------
function connectCommentRoom(){
  if (window._fbCurrentUnsub) { window._fbCurrentUnsub(); window._fbCurrentUnsub = null; }
  if (!window._fbDb || !selectedDay || !schoolKey()) return;

  const roomPath = `comments/${schoolKey()}/${ymdStr(viewYear,viewMonth,selectedDay)}_${MEALCODE[selectedMeal]}`;
  window._currentRoomPath = roomPath;
  const listEl = document.getElementById('commentList');
  if (listEl) listEl.innerHTML = '<div class="no-comments">불러오는 중...</div>';

  const commentsRef = window._fbRef(window._fbDb, roomPath);
  window._fbCurrentUnsub = window._fbOnValue(commentsRef, snap => {
    const data = snap.val();
    const el = document.getElementById('commentList');
    if (!el) return;
    if (!data) { el.innerHTML = '<div class="no-comments">아직 한줄평이 없어요.<br>첫 댓글을 남겨보세요! 🩷</div>'; return; }
    const arr = Object.values(data).sort((a,b) => a.ts - b.ts);
    el.innerHTML = arr.map(c => `
      <div class="comment-item">
        <div class="comment-meta"><span>👤 ${escapeHtml(c.nick)}</span><span>${c.time || ''}</span></div>
        <div>${escapeHtml(c.text)}</div>
      </div>`).join('');
    el.scrollTop = el.scrollHeight;
  });
}

function connectStars(){
  if (window._fbStarUnsub) { window._fbStarUnsub(); window._fbStarUnsub = null; }

function connectMealTimes(){

// ---------- 급식 알림 (로컬 알림, 개인 기기) ----------
const NOTIF_HOUR = 6; // 아침 6시
let _notifTimer = null;

function notifEnabled(){ return localStorage.getItem('meal_notif') === '1'; }

async function toggleNotif(on){
  if (on){
    if (!('Notification' in window)){
      alert('이 브라우저는 알림을 지원하지 않아요 😢');
      return false;
    }
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted'){
      alert('알림 권한이 꺼져 있어요. 브라우저 설정에서 알림을 허용해 주세요.');
      return false;
    }
    localStorage.setItem('meal_notif','1');
    scheduleMealNotif();
    return true;
  } else {
    localStorage.removeItem('meal_notif');
    if (_notifTimer){ clearTimeout(_notifTimer); _notifTimer = null; }
    return true;
  }
}

// 다음 아침 6시까지 예약 (앱이 열려있는 동안 작동)
function scheduleMealNotif(){
  if (!notifEnabled()) return;
  if (_notifTimer){ clearTimeout(_notifTimer); _notifTimer = null; }
  const now = new Date();
  const next = new Date();
  next.setHours(NOTIF_HOUR, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1); // 이미 지났으면 내일
  const ms = next - now;
  // setTimeout 최대 한계 회피 (약 24.8일). 6시까지는 항상 그 안이라 안전.
  _notifTimer = setTimeout(() => {
    fireMealNotif();
    scheduleMealNotif(); // 다음 날 재예약
  }, ms);
}

// 오늘 별표 메뉴를 조식/중식/석식으로 정리해 알림 발송
function fireMealNotif(){
  if (!notifEnabled()) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const today = new Date().getDate();
  const now = new Date();
  // 이번 달 데이터가 아니면 스킵
  if (now.getFullYear() !== viewYear || now.getMonth()+1 !== viewMonth) return;

  const lines = [];
  ORDER.forEach(meal => {
    if (!meals[meal] || !meals[meal][today]) return;
    const favs = meals[meal][today].items.filter(it => favorites[favId(today, meal, it)]).map(it => cleanName(it));
    if (favs.length) lines.push(`${meal} - ${favs.join(', ')}`);
  });
  const body = lines.length ? lines.join('\n') : '오늘은 별표한 메뉴가 없어요 🍽️';
  const title = lines.length ? '⭐ 오늘 좋아하는 메뉴가 나와요!' : '오늘의 급식';

  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, { body, icon:'./icon-192.png', badge:'./icon-192.png', tag:'meal-daily' }));
    } else {
      new Notification(title, { body, icon:'./icon-192.png' });
    }
  } catch(e){ try { new Notification(title, { body }); } catch(_){} }
}

// 앱 열 때 알림 켜져 있으면 예약 복구
function initMealNotif(){ if (notifEnabled()) scheduleMealNotif(); }

function notifToggleHTML(){
  const on = notifEnabled();
  return `
    <label style="display:block;font-size:17px;font-weight:700;color:var(--c-primary);margin:0 0 4px;">🔔 급식 알림</label>

    </div>

async function onToggleNotif(){
  const willOn = !notifEnabled();
  const ok = await toggleNotif(willOn);
  if (!ok) return;
  const btn = document.getElementById('notifToggleBtn');
  if (btn){
    const on = notifEnabled();
    btn.className = on ? 'btn-primary' : 'btn-ghost';
    btn.textContent = on ? '🔔 알림 켜짐' : '🔕 알림 꺼짐';
  }
  if (notifEnabled()){
    // 켠 직후 미리보기 알림 한 번
    setTimeout(fireMealNotif, 600);
  }
}

async function submitFeedback() {
  const txt = document.getElementById('feedbackText').value.trim();
  const msgEl = document.getElementById('feedbackMsg');
  if (!txt) { msgEl.textContent = '내용을 입력해 주세요 🥲'; return; }
  if (!window._fbDb) { msgEl.textContent = 'Firebase 연결 중이에요, 잠깐만요...'; return; }
  try {
    await window._fbPush(window._fbRef(window._fbDb, 'feedback'), {
      text: txt,
      school: school ? school.name : '(미선택)',
      ts: Date.now(),
      ua: navigator.userAgent.slice(0, 80),
    });
    msgEl.style.color = 'var(--c-primary)';
    msgEl.textContent = '전송됐어요! 고마워요 🩷';
    document.getElementById('feedbackText').value = '';

  } catch(e) {
    msgEl.style.color = '#d04080';
    msgEl.textContent = '전송 실패 😢 (' + e.message + ')';
  }
}

const HL_COLORS = ['#ffe08a', '#a8d8ff', '#ffb3c8', '#b8f0c0', '#d8b8f0', '#ffc8a0'];
const TT_COLS = 6;            // 시간당 칸 (10분 단위)
const TT_CELLS = 24 * TT_COLS;

function normalizeMemo(o){
  o = o || {};
  return {
    title: o.title || '',
    todos: Array.isArray(o.todos) ? o.todos : [],
    note: o.note || '',
    cells: (Array.isArray(o.cells) && o.cells.length === TT_CELLS) ? o.cells : new Array(TT_CELLS).fill(null),
    groups: o.groups || {}
  };
}
function getMemo(ymd){
  try { const o = JSON.parse(localStorage.getItem('meal_memo_' + ymd) || 'null'); if (o) return normalizeMemo(o); } catch(e){}
  return normalizeMemo(null);
}

let _memoDay = null, _memo = null;
let _ttColor = HL_COLORS[0], _ttPending = null, _ttSelGroup = null;
let _ttDragging = false, _ttDragStart = null, _ttDragCur = null, _ttMoved = false;

function persistMemo(){
  if (_memoDay == null) return;
  localStorage.setItem('meal_memo_' + ymdStr(viewYear, viewMonth, _memoDay), JSON.stringify(_memo));
}

// 달력칸의 메모 진입점 (제목 있으면 제목, 없으면 +)
function calMemoHTML(d){

function updateCalMemo(d){

// ----- To-do -----
function renderTodos(){
  const el = document.getElementById('todoList');
  if (!el) return;
  if (!_memo.todos.length) { el.innerHTML = `<div style="color:#d8a8c0;font-size:15px;padding:4px 2px;">할 일이 없어요</div>`; return; }
  el.innerHTML = _memo.todos.map((t, i) => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <span class="todo-check" onclick="toggleTodo(${i})">${t.done ? '✓' : ''}</span>
      <span class="todo-text">${escapeHtml(t.t)}</span>
      <span class="todo-del" onclick="delTodo(${i})">✕</span>
    </div>`).join('');
}
function addTodo(){
  const inp = document.getElementById('todoInput');
  const v = inp.value.trim();
  if (!v) return;
  _memo.todos.push({ t: v, done: false });
  inp.value = '';
  persistMemo(); renderTodos();
}
function toggleTodo(i){ _memo.todos[i].done = !_memo.todos[i].done; persistMemo(); renderTodos(); }
function delTodo(i){ _memo.todos.splice(i, 1); persistMemo(); renderTodos(); }

// ----- 타임테이블 형광펜 -----
function setTTColor(c){
  _ttColor = c;
  document.querySelectorAll('.tt-color').forEach(el => el.classList.toggle('sel', el.style.background.includes(c) ));
  // 정확히 다시 칠하기
  const dots = document.querySelectorAll('.tt-color');
  dots.forEach((el, idx) => el.classList.toggle('sel', HL_COLORS[idx] === c));
}
function renderTT(){
  const grid = document.getElementById('ttGrid');
  if (!grid) return;
  // 형광펜 그룹별 칸 모으기
  const groupCells = {};
  for (let i = 0; i < TT_CELLS; i++){ const c = _memo.cells[i]; if (c){ (groupCells[c.g] = groupCells[c.g] || []).push(i); } }
  const TT_START = 4; // 04시부터 표시 시작
  let html = '';
  for (let dh = 0; dh < 24; dh++){
    const h = (dh + TT_START) % 24;
    let cells = '';
    for (let col = 0; col < TT_COLS; col++){
      const i = h * TT_COLS + col;
      const c = _memo.cells[i];
      const bg = c ? `background:${c.c};` : '';
      const pend = (_ttPending === i) ? ' pending' : '';
      cells += `<div class="tt-cell${pend}" style="${bg}" data-i="${i}"></div>`;
    }
    html += `<div class="tt-row"><div class="tt-hour">${pad(h)}</div><div class="tt-cells">${cells}</div></div>`;
  }
  // 메모는 그리드 전체에 겹치는 오버레이로: 그룹 시작 칸에서 시작해 형광펜을 따라 흐름(첫 줄만 들여쓰기)
  const ROW_H = 21; // 칸 높이 20 + 경계선 1
  let labels = '';
  for (const g in groupCells){
    const gg = _memo.groups[g];
    if (!gg || !gg.memo) continue;
    const start = groupCells[g][0];
    const h0 = Math.floor(start / TT_COLS), col0 = start % TT_COLS;
    const dispRow = (h0 - TT_START + 24) % 24;   // 04시 시작 기준 표시 줄
    const top = dispRow * ROW_H;
    const indent = (col0 / TT_COLS * 100);
    labels += `<div class="tt-memo-label" style="top:${top}px;text-indent:${indent}%;">${escapeHtml(gg.memo)}</div>`;
  }
  html += `<div class="tt-labels">${labels}</div>`;
  grid.innerHTML = html;
  renderTTPanel();
}
function renderTTPanel(){
  const p = document.getElementById('ttPanel');
  if (!p) return;
  if (!_ttSelGroup || !_memo.groups[_ttSelGroup]){ p.innerHTML = ''; return; }
  const g = _memo.groups[_ttSelGroup];
  p.innerHTML = `<div class="tt-edit">
    <input id="ttMemoInput" placeholder="이 형광펜에 메모" value="${escapeHtml(g.memo || '')}"
      oninput="_memo.groups['${_ttSelGroup}'].memo=this.value; persistMemo();"
      onkeydown="if(event.key==='Enter'){renderTT();}">
    <button class="tt-edit-del" onclick="deleteGroup('${_ttSelGroup}')">🗑 삭제</button>
    <button class="tt-edit-ok" onclick="_ttSelGroup=null; renderTT();">확인</button>
  </div>`;
  const mi = document.getElementById('ttMemoInput'); if (mi) mi.focus();
}

function cellIdxFromEvent(e){
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.classList.contains('tt-cell')) return parseInt(el.dataset.i, 10);
  if (el && el.classList.contains('tt-memo-label')) return parseInt(el.parentElement.dataset.i, 10);
  return null;
}
function ttDownC(e){
  const i = cellIdxFromEvent(e);
  if (i == null) return;
  e.preventDefault();
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
  _ttDragging = true; _ttDragStart = i; _ttDragCur = i; _ttMoved = false;
}
function ttMoveC(e){
  if (!_ttDragging) return;
  const i = cellIdxFromEvent(e);
  if (i == null || i === _ttDragCur) return;
  _ttDragCur = i;
  if (i !== _ttDragStart) _ttMoved = true;
  previewRange();
}
function ttUpC(e){
  if (!_ttDragging) return;
  _ttDragging = false;
  if (_ttMoved){ commitRange(_ttDragStart, _ttDragCur); _ttPending = null; _ttSelGroup = null; }
  else { handleTap(_ttDragStart); }
  renderTT();
}
function ttCancel(){ _ttDragging = false; previewClear(); }

function handleTap(i){
  if (_ttPending != null){ commitRange(_ttPending, i); _ttPending = null; _ttSelGroup = null; }
  else if (_memo.cells[i]){ _ttSelGroup = _memo.cells[i].g; }
  else { _ttPending = i; _ttSelGroup = null; }
}
function previewRange(){
  const lo = Math.min(_ttDragStart, _ttDragCur), hi = Math.max(_ttDragStart, _ttDragCur);
  document.querySelectorAll('.tt-cell').forEach(el => {
    const i = parseInt(el.dataset.i, 10);
    el.classList.toggle('preview', i >= lo && i <= hi);
  });
}
function previewClear(){ document.querySelectorAll('.tt-cell.preview').forEach(el => el.classList.remove('preview')); }

function commitRange(a, b){
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const gid = 'g' + Date.now() + Math.floor(Math.random() * 1000);
  for (let i = lo; i <= hi; i++) _memo.cells[i] = { c: _ttColor, g: gid };
  _memo.groups[gid] = { color: _ttColor, memo: '' };
  cleanupGroups();
  persistMemo();
}
function cleanupGroups(){
  const used = {};
  _memo.cells.forEach(c => { if (c) used[c.g] = true; });
  Object.keys(_memo.groups).forEach(g => { if (!used[g]) delete _memo.groups[g]; });
}
function deleteGroup(gid){
  for (let i = 0; i < TT_CELLS; i++){ if (_memo.cells[i] && _memo.cells[i].g === gid) _memo.cells[i] = null; }
  delete _memo.groups[gid];
  _ttSelGroup = null;
  persistMemo(); renderTT();
}
function clearAllTT(){
  if (!_memo.cells.some(c => c)) return;
  if (!confirm('타임테이블 형광펜을 모두 지울까요?')) return;
  _memo.cells = new Array(TT_CELLS).fill(null);
  _memo.groups = {};
  _ttPending = null; _ttSelGroup = null;
  persistMemo(); renderTT();
}

        <div class="rep-opts">
          <label><input type="radio" name="rep-mode" value="merge" checked> 합치기 (빈 칸만 채워요)</label>
          <label><input type="radio" name="rep-mode" value="replace"> 덮어쓰기 (그날 걸 지우고 교체)</label>
        </div>

        <div class="row-btns" style="margin-top:20px;">
          <button class="btn-primary" onclick="applyRepeat()">적용</button>

        </div>
      </div>
    </div>`;

function applyRepeat(){
  const pat = (document.querySelector('input[name="rep-pat"]:checked') || {}).value || 'weekly';
  const mode = (document.querySelector('input[name="rep-mode"]:checked') || {}).value || 'merge';
  let weeks = parseInt(document.getElementById('repWeeks').value, 10);
  if (!weeks || weeks < 1) weeks = 1;
  if (weeks > 52) weeks = 52;

  const src = new Date(viewYear, viewMonth - 1, _memoDay);
  const srcDow = src.getDay();
  const srcCells = _memo.cells, srcGroups = _memo.groups;
  const totalDays = weeks * 7;
  let count = 0;

  for (let off = 1; off <= totalDays; off++){
    const dt = new Date(src); dt.setDate(dt.getDate() + off);
    const dow = dt.getDay();
    let match = false;
    if (pat === 'daily') match = true;
    else if (pat === 'weekly') match = (dow === srcDow);
    else if (pat === 'weekday') match = (dow >= 1 && dow <= 5);
    else if (pat === 'weekend') match = (dow === 0 || dow === 6);
    if (!match) continue;

    const ymd = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
    const tgt = getMemo(ymd);

    if (mode === 'replace'){
      tgt.cells = srcCells.map(c => c ? { c: c.c, g: c.g } : null);
      tgt.groups = {};
      for (const g in srcGroups) tgt.groups[g] = { color: srcGroups[g].color, memo: srcGroups[g].memo };
    } else {
      for (let i = 0; i < TT_CELLS; i++){
        if (srcCells[i] && !tgt.cells[i]){
          tgt.cells[i] = { c: srcCells[i].c, g: srcCells[i].g };
          const sg = srcGroups[srcCells[i].g];
          if (sg) tgt.groups[srcCells[i].g] = { color: sg.color, memo: sg.memo };
        }
      }
      const used = {}; tgt.cells.forEach(c => { if (c) used[c.g] = true; });
      Object.keys(tgt.groups).forEach(g => { if (!used[g]) delete tgt.groups[g]; });
    }
    localStorage.setItem('meal_memo_' + ymd, JSON.stringify(tgt));
    count++;
  }

  alert(count + '일에 타임테이블을 적용했어요! 🎀');
  openMemoBack();
}

(function(){
  function getMenuPreview(mealKey){
    const real = new Date();
    if (real.getFullYear() !== viewYear || (real.getMonth()+1) !== viewMonth) return '';
    const data = meals[mealKey] && meals[mealKey][real.getDate()];
    if (!data || !data.items) return '';
    return data.items.slice(0, 3).map(i => cleanName(i)).join(' · ');
  }
  function tick(){
    const labelEl = document.getElementById('timerLabel');
    if (!labelEl) return; // 타이머 미표시 상태
    const now = new Date();
    const order = [ ['b','조식','🌅'], ['l','중식','🍱'], ['d','석식','🌙'] ];
    let target = null, tInfo = null;
    for (const [code, nm, emo] of order) {
      const [hh, mm] = (mealTimes[code] || DEFAULT_TIMES[code]).split(':').map(Number);
      const t = new Date(now); t.setHours(hh, mm, 0, 0);
      if (t > now) { target = t; tInfo = { code, nm, emo, hh, mm }; break; }
    }
    const nameEl = document.getElementById('timerMealName');
    const previewEl = document.getElementById('timerMenuPreview');
    const hEl = document.getElementById('timerH'), mEl = document.getElementById('timerM'), sEl = document.getElementById('timerS');
    if (!target) {
      labelEl.textContent = '🌙 오늘 급식 끝!';
      nameEl.textContent = '내일 또 만나요 👋';
      previewEl.textContent = '';
      hEl.textContent = '--'; mEl.textContent = '--'; sEl.textContent = '--';
      return;
    }
    const diff = Math.max(0, Math.floor((target - now) / 1000));
    labelEl.textContent = `⏳ ${tInfo.nm}까지`;
    nameEl.textContent = `${tInfo.emo} ${pad(tInfo.hh)}:${pad(tInfo.mm)} ${tInfo.nm}`;
    previewEl.textContent = getMenuPreview(tInfo.nm);
    hEl.textContent = pad(Math.floor(diff/3600));
    mEl.textContent = pad(Math.floor((diff%3600)/60));
    sEl.textContent = pad(diff%60);
  }
  setInterval(tick, 1000);
  window._timerTick = tick;
})();

// ===== 디데이 (개인: localStorage / 공용: Firebase) =====
const ADMIN_CODE = 'mymmj-admin';  // 관리자 코드 (원하면 바꿔도 됨)
let _ddayTab = 'personal';
let _pubDdays = {};       // Firebase 공용 디데이 캐시
let _pubUnsub = null;

// 기기 고유 ID (공용 디데이 게시자 식별용)
function _deviceId(){
  let id = localStorage.getItem('device_id');
  if (!id) { id = 'dev_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); try{localStorage.setItem('device_id',id);}catch(e){} }
  return id;
}
function _isAdmin(){ return localStorage.getItem('dday_admin') === '1'; }

function getPersonalDdays(){
  try { return JSON.parse(localStorage.getItem('personal_ddays') || '[]'); } catch(e){ return []; }
}
function savePersonalDdays(arr){ try{ localStorage.setItem('personal_ddays', JSON.stringify(arr)); }catch(e){} }

// D-day 계산: 오늘 기준 남은 일수
function _ddayCalc(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((target - today) / 86400000);
  return diff;
}
function _ddayText(diff){
  if (diff > 0) return 'D-' + diff;
  if (diff === 0) return 'D-DAY';
  return 'D+' + (-diff);
}

let _pubSubscribedKey = null;
function initDday(){
  // 공용 디데이 실시간 구독 (학교별)
  const sk = schoolKey();
  if (window._fbDb && sk && _pubSubscribedKey !== sk){
    if (_pubUnsub) { try{ _pubUnsub(); }catch(e){} _pubUnsub = null; }
    _pubSubscribedKey = sk;
    _pubDdays = {};
    _pubUnsub = window._fbOnValue(window._fbRef(window._fbDb, `pub_ddays/${sk}`), snap => {
      _pubDdays = snap.val() || {};
      renderDdayBar();
      renderDdayModalBody(); // 모달 열려있으면 갱신
    });
  } else if (!sk){
    // 학교 미선택: 공용 디데이 없음
    if (_pubUnsub) { try{ _pubUnsub(); }catch(e){} _pubUnsub = null; }
    _pubSubscribedKey = null;
    _pubDdays = {};
  }
  renderDdayBar();
}

// 제목 아래 디데이 바 렌더링
function renderDdayBar(){
  const bar = document.getElementById('ddayBar');
  if (!bar) return;
  const items = [];
  // 개인
  getPersonalDdays().forEach(d => items.push({ ...d, pub:false }));
  // 공용
  Object.entries(_pubDdays).forEach(([k,v]) => items.push({ ...v, key:k, pub:true }));
  // 미래가 가까운 순 정렬 (지난 건 뒤로)
  items.sort((a,b) => _ddayCalc(a.date) - _ddayCalc(b.date));
  if (items.length === 0){
    bar.innerHTML = `<div class="dday-chip dday-add-hint"><span class="dd-label">📌 디데이 추가하기</span></div>`;
    return;
  }
  bar.innerHTML = items.map(d => {
    const diff = _ddayCalc(d.date);
    const past = diff < 0;
    return `<div class="dday-chip ${d.pub?'public':''} ${past?'past':''}">
      <span class="dd-num">${_ddayText(diff)}</span>
      <span class="dd-label">${escapeHtml(d.label)}</span>
      ${d.pub ? '<span class="dd-pub">공용</span>' : ''}
    </div>`;
  }).join('');
}

function renderDdayModalBody(){
  const body = document.getElementById('ddayModalBody');

  if (_ddayTab === 'personal'){
    const arr = getPersonalDdays().map((d,i)=>({...d,idx:i}));
    arr.sort((a,b)=>_ddayCalc(a.date)-_ddayCalc(b.date));
    body.innerHTML = `
      <div class="dday-list">
        ${arr.length ? arr.map(d=>{
          const diff=_ddayCalc(d.date);
          return `<div class="dday-row">
            <div class="dr-info"><div class="dr-title">${escapeHtml(d.label)}</div><div class="dr-sub">${d.date}</div></div>
            <span class="dr-dday">${_ddayText(diff)}</span>

        <input id="ddInputDate" type="date">

    const arr = Object.entries(_pubDdays).map(([k,v])=>({...v,key:k}));

    body.innerHTML = `
      <div class="dday-list">
        ${arr.length ? arr.map(d=>{

          return `<div class="dday-row">
            <div class="dr-info"><div class="dr-title">${escapeHtml(d.label)}</div><div class="dr-sub">${d.date} · ${escapeHtml(d.by||'익명')}</div></div>
            <span class="dr-dday">${_ddayText(diff)}</span>
            ${canDel ? `<button class="dr-del" onclick="delPublicDday('${d.key}')">🗑</button>` : ''}
          </div>`;
        }).join('') : '<div class="dday-empty">아직 공용 디데이가 없어요.<br>누구나 추가할 수 있어요! 🌟</div>'}
      </div>
      <div class="dday-add">
        <input id="ddInputLabel" maxlength="20" placeholder="이름 (예: 축제)">

        <button class="btn-primary" onclick="addPublicDday()">공용 디데이 추가</button>

      </div>`;
  }
}

function _readDdayInputs(){
  const label = (document.getElementById('ddInputLabel').value||'').trim();
  const date = (document.getElementById('ddInputDate').value||'').trim();
  if (!label){ alert('이름을 입력해 주세요.'); return null; }

function addPersonalDday(){
  const v = _readDdayInputs(); if(!v) return;
  const arr = getPersonalDdays();
  arr.push({ label:v.label, date:v.date });
  savePersonalDdays(arr);
  renderDdayBar(); renderDdayModalBody();
}
function delPersonalDday(idx){
  const arr = getPersonalDdays();
  arr.splice(idx,1);
  savePersonalDdays(arr);
  renderDdayBar(); renderDdayModalBody();
}
function addPublicDday(){
  const v = _readDdayInputs(); if(!v) return;
  if (!window._fbDb){ alert('네트워크 연결을 확인해 주세요.'); return; }
  const sk = schoolKey();
  if (!sk){ alert('먼저 학교를 선택해 주세요.'); return; }
  window._fbPush(window._fbRef(window._fbDb, `pub_ddays/${sk}`), {
    label:v.label, date:v.date, owner:_deviceId(), by: myNick, ts: Date.now()
  });
  document.getElementById('ddInputLabel').value = '';
  document.getElementById('ddInputDate').value = '';
}
function delPublicDday(key){
  const d = _pubDdays[key];
  if (!d) return;
  if (!(_isAdmin() || d.owner === _deviceId())){ alert('삭제 권한이 없어요.'); return; }
  if (!confirm('이 공용 디데이를 삭제할까요?')) return;
  window._fbRemove(window._fbRef(window._fbDb, `pub_ddays/${schoolKey()}/${key}`));
}
function promptAdmin(){
  const code = prompt('관리자 코드를 입력해 주세요');
  if (code === null) return;
  if (code === ADMIN_CODE){ try{localStorage.setItem('dday_admin','1');}catch(e){} alert('관리자 모드가 켜졌어요! 🔑'); renderDdayModalBody(); }
  else alert('코드가 맞지 않아요.');
}

function _pickFortune(){
  // 완전 랜덤 (하루 제한 없음). 직전과 같은 건 되도록 피함
  let idx = Math.floor(Math.random() * FORTUNES.length);
  const last = parseInt(localStorage.getItem('fortune_last'), 10);
  if (!isNaN(last) && FORTUNES.length > 1 && idx === last){
    idx = (idx + 1 + Math.floor(Math.random()*(FORTUNES.length-1))) % FORTUNES.length;
  }
  return idx;
}
function _savedFortune(){
  const i = parseInt(localStorage.getItem('fortune_last'), 10);
  return (!isNaN(i) && FORTUNES[i]) ? FORTUNES[i] : null;
}
function openFortune(){
  const saved = _savedFortune();
  const mount = document.getElementById('modalMount');
  mount.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:340px;text-align:center;max-height:88vh;overflow-y:auto;">
        <h2>🥠 오늘의 운세</h2>
        <div class="fortune-stage" id="fortuneStage">
          ${saved ? '' : '<div class="fortune-cookie" id="fortuneCookie" onclick="_crackCookie()">🥠</div>'}
        </div>
        <p class="fortune-hint" id="fortuneHint">${saved ? '' : '쿠키를 톡! 눌러보세요'}</p>
        <div class="row-btns" style="margin-top:14px;">
          <button class="btn-primary" id="redrawBtn" style="flex:1;display:${saved?'block':'none'};" onclick="_redrawFortune()">🥠 다시 뽑기</button>
          <button class="btn-ghost" style="flex:1;" onclick="closeModal()">닫기</button>
        </div>
      </div>
    </div>`;
  if (saved) { setTimeout(()=>_revealFortune(saved, true), 60); }
}
function _crackCookie(){
  const cookie = document.getElementById('fortuneCookie');
  if (!cookie || cookie.dataset.done) return;
  cookie.dataset.done = '1';
  cookie.classList.add('shake');
  const idx = _pickFortune();
  try { localStorage.setItem('fortune_last', String(idx)); } catch(e){}
  setTimeout(()=>_revealFortune(FORTUNES[idx], false), 420);
}
function _redrawFortune(){
  const idx = _pickFortune();
  try { localStorage.setItem('fortune_last', String(idx)); } catch(e){}
  const stage = document.getElementById('fortuneStage');
  if (stage){
    // 쿠키 다시 놓고 깨는 연출 재생
    stage.innerHTML = '<div class="cookie-crack">🥠</div><div class="fortune-paper" id="fortunePaper"><div class="fp-msg">'+ escapeHtml(FORTUNES[idx].m) +'</div></div>';
    requestAnimationFrame(()=>{ const p=document.getElementById('fortunePaper'); if(p) p.classList.add('show'); });
  }
  const hint = document.getElementById('fortuneHint');
  if (hint) hint.textContent = '새 운세가 나왔어요! 🍀';
}
function _revealFortune(f, instant){
  const stage = document.getElementById('fortuneStage');
  const hint = document.getElementById('fortuneHint');
  if (!stage) return;
  if (instant) {
    // 이미 뽑은 운세 → 쿠키 없이 종이만 바로 표시
    stage.innerHTML = `
      <div class="fortune-paper show" id="fortunePaper">
        <div class="fp-msg">${escapeHtml(f.m)}</div>
      </div>`;
  } else {
    // 진짜 깨지는 연출: 쿠키가 툭 갈라지듯 튕겨 아래로 떨어져 사라지고 종이만 남음
    stage.innerHTML = `
      <div class="cookie-crack">🥠</div>
      <div class="fortune-paper" id="fortunePaper">
        <div class="fp-msg">${escapeHtml(f.m)}</div>
      </div>`;
    requestAnimationFrame(()=>{ const p=document.getElementById('fortunePaper'); if(p) p.classList.add('show'); });
  }
  // 종이가 나오면 '다시 뽑기' 버튼 보이게
  const rb = document.getElementById('redrawBtn'); if (rb) rb.style.display = 'block';
  if (hint) hint.textContent = instant ? '' : '운세가 나왔어요! 🍀';
}

// ===== 인앱 브라우저 감지 + 앱 설치 유도 =====
(function(){
  const ua = navigator.userAgent || '';
  const isAndroid = /android/i.test(ua);
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  // 메신저/SNS 인앱 브라우저 감지
  const isInApp = /KAKAOTALK|FBAN|FBAV|Instagram|Line\/|NAVER|DaumApps|everytimeApp|band|wadiz/i.test(ua);
  // 이미 홈화면 앱(standalone)으로 실행 중이면 아무것도 안 함
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  const url = location.href;

  function show(html){
    // 기존 모달 안 건드리고 별도 레이어 사용
    let m = document.getElementById('promoMount');
    if(!m){ m = document.createElement('div'); m.id='promoMount'; document.body.appendChild(m); }
    m.innerHTML = html;
  }
  function close(){ const m=document.getElementById('promoMount'); if(m) m.innerHTML=''; }
  window._promoClose = close;
  // 오늘 날짜 키 (YYYY-MM-DD)
  const today = new Date().toISOString().slice(0,10);
  window._inappDismissToday = function(){ try{ localStorage.setItem('inapp_dismissed_date', today); }catch(e){} close(); };

  // --- 1) 인앱 브라우저면: 외부 브라우저로 열기 유도 ---
  if (isInApp && !isStandalone) {
    // 오늘 이미 닫았으면 안 띄움 (다음 날 다시 한 번)
    if (localStorage.getItem('inapp_dismissed_date') === today) return;
    if (isAndroid) {
      // 안드로이드: 크롬으로 강제 오픈 시도 (intent)
      const clean = url.replace(/^https?:\/\//,'');
      // 안내 먼저 띄우고, 버튼으로 크롬 열기 (자동 리다이렉트는 카톡이 막는 경우 있어 버튼식이 안전)
      show(`
        <div class="overlay" style="z-index:200;" onclick="if(event.target===this)_inappDismissToday()">
          <div class="modal" style="max-width:380px;text-align:center;">
            <h2>🌷 잠깐!</h2>
            <p class="hint" style="margin-bottom:16px;">지금은 <b>카톡 같은 앱 안의 브라우저</b>라서<br>설정·별명·즐겨찾기가 저장되지 않아요 😢<br><br>아래 버튼으로 <b>크롬에서 열면</b> 모두 저장돼요!</p>
            <div class="row-btns" style="flex-direction:column;">
              <button class="btn-primary" onclick="location.href='intent://${clean}#Intent;scheme=https;package=com.android.chrome;end'">크롬으로 열기 🚀</button>
              <button class="btn-ghost" style="margin-top:8px;" onclick="_inappDismissToday()">그냥 둘러볼게요</button>
            </div>
          </div>
        </div>`);
    } else {
      // iOS 등: 자동 전환 불가 → 안내만
      show(`
        <div class="overlay" style="z-index:200;" onclick="if(event.target===this)_inappDismissToday()">
          <div class="modal" style="max-width:380px;text-align:center;">
            <h2>🌷 잠깐!</h2>
            <p class="hint" style="margin-bottom:16px;">지금은 <b>카톡·인스타 안의 브라우저</b>라서<br>설정·별명·즐겨찾기가 저장되지 않아요 😢</p>
            <p class="hint" style="background:var(--c-bg);border-radius:12px;padding:12px;margin-bottom:4px;">
              오른쪽 위 <b>···</b> 또는 <b>공유 버튼</b>을 눌러<br><b>"Safari로 열기"</b>를 선택해 주세요!</p>
            <div class="row-btns">
              <button class="btn-ghost" style="flex:1;" onclick="_inappDismissToday()">알겠어요</button>
            </div>
          </div>
        </div>`);
    }
    return; // 인앱이면 설치 유도는 생략
  }

  // --- 2) 일반 브라우저: 앱 설치(홈화면 추가) 유도 ---
  if (isStandalone) return; // 이미 설치됨
  if (localStorage.getItem('install_dismissed')) return; // 사용자가 이전에 닫았으면 안 띄움

  let deferredPrompt = null;

  // 안드로이드 크롬: beforeinstallprompt 잡아서 직접 설치 버튼 제공
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    show(`
      <div class="overlay" style="z-index:200;" onclick="if(event.target===this)_promoClose()">
        <div class="modal" style="max-width:380px;text-align:center;">
          <h2>📲 앱으로 설치할까요?</h2>
          <p class="hint" style="margin-bottom:16px;">홈 화면에 추가하면 앱처럼 빠르게 열리고,<br>설정·별명·즐겨찾기가 <b>계속 저장</b>돼요!</p>
          <div class="row-btns" style="flex-direction:column;">
            <button class="btn-primary" id="doInstallBtn">홈 화면에 추가 🏠</button>
            <button class="btn-ghost" style="margin-top:8px;" onclick="localStorage.setItem('install_dismissed','1');_promoClose()">다음에요</button>
          </div>
        </div>`);
    setTimeout(()=>{
      const b = document.getElementById('doInstallBtn');
      if(b) b.onclick = async () => {
        close();
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      };
    }, 40);
  });

  // iOS 사파리: beforeinstallprompt 없음 → 수동 안내 (사파리에서 열었을 때만)
  if (isIOS) {
    const isSafari = /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
    if (isSafari) {
      // 첫 방문 살짝 늦게 띄워 거슬리지 않게
      setTimeout(()=>{
        if (localStorage.getItem('install_dismissed')) return;
        show(`
          <div class="overlay" style="z-index:200;" onclick="if(event.target===this)_promoClose()">
            <div class="modal" style="max-width:380px;text-align:center;">
              <h2>📲 앱처럼 쓰기</h2>
              <p class="hint" style="margin-bottom:8px;">홈 화면에 추가하면 설정·별명·즐겨찾기가<br><b>계속 저장</b>되고 빠르게 열려요!</p>
              <p class="hint" style="background:var(--c-bg);border-radius:12px;padding:12px;">
                아래 <b>공유 버튼 ⬆️</b> → <b>"홈 화면에 추가"</b>를 눌러주세요!</p>
              <div class="row-btns">
                <button class="btn-ghost" style="flex:1;" onclick="localStorage.setItem('install_dismissed','1');_promoClose()">알겠어요</button>
              </div>
            </div>`);
      }, 3000);
    }
  }
})();
</script>
